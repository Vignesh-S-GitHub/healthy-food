<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Simple daily meal pairs with protein, fibre and carbohydrate sources." />
  <meta name="theme-color" content="#f7f8f3" />
  <title>Healthy Food · Today's Menu</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/meal-icon.svg" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home"><span aria-hidden="true">🥗</span> Healthy Food</a>
    <time id="todayDate"></time>
  </header>
  <main id="home">
    <section class="daily-section" aria-labelledby="dailyHeading">
      <div class="section-heading">
        <div><h1 id="dailyHeading">Today's Menu</h1></div>
        <button id="shuffleButton" class="primary-button" type="button">↻ Shuffle</button>
      </div>
      <fieldset class="diet-filter">
        <legend class="sr-only">Diet</legend>
        <label><input type="radio" name="diet" value="all" checked><span>All</span></label>
        <label><input type="radio" name="diet" value="veg"><span>Veg only</span></label>
      </fieldset>
      <p id="planStatus" class="sr-only" role="status" aria-live="polite"></p>
      <div id="dailyPlan" class="meal-grid daily-grid"></div>
      <div id="dailySnack" class="daily-snack"></div>
    </section>
    <nav class="meal-jump" aria-label="Meals">
      <a href="#breakfast">🌅 Breakfast</a>
      <a href="#lunch">☀️ Lunch</a>
      <a href="#dinner">🌙 Dinner</a>
      <a href="#snacks">🍎 Snacks</a>
      <a href="#stock">🛒 Stock up</a>
    </nav>
    <div id="mealSections"></div>
    <details class="stock-section section" id="stock">
      <summary>🛒 Stock up</summary>
      <div id="stockGrid" class="stock-grid"></div>
    </details>
    <footer><span>Images are illustrative.</span><a href="#home">Top ↑</a></footer>
    <noscript><p>Enable JavaScript to see the menu.</p></noscript>
  </main>
  <script src="script.js?v=4"></script>
</body>
</html>
